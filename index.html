<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rəqəmsal Menyu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Xoş gəlmisiniz Hissəsi -->
  <header class="hero">
    <div class="overlay">
      <h1>Restoranımıza Xoş Gəlmisiniz!</h1>
      <p>Ləzzətli təamlar və sərin içkilər sizi gözləyir.</p>
    </div>
  </header>

  <!-- İdarəetmə Paneli (Müştəriyə görünmür, gizlidir) -->
  <section class="admin-panel hidden" id="adminPanel">
    <h3>Yeni Məhsul Əlavə Et</h3>
    <input type="text" id="pName" placeholder="Məhsul adı">
    <input type="text" id="pPrice" placeholder="Qiymət (məs: 5 AZN)">
    <select id="pCategory">
      <option value="ickiler">İçkilər</option>
      <option value="yemekler">Yeməklər</option>
      <option value="desertler">Desertlər</option>
    </select>
    <input type="file" id="pImage" accept="image/*">
    <button onclick="addProduct()">Əlavə et</button>
  </section>

  <!-- Kateqoriyalar və Menyu -->
  <main class="menu-container">
    <h2>Menyu</h2>
    
    <section>
      <h3 class="cat-title">İçkilər</h3>
      <div id="ickiler" class="grid"></div>
    </section>

    <section>
      <h3 class="cat-title">Yeməklər</h3>
      <div id="yemekler" class="grid"></div>
    </section>

    <section>
      <h3 class="cat-title">Desertlər</h3>
      <div id="desertler" class="grid"></div>
    </section>
  </main>

  <!-- Əlaqə və Ünvan Hissəsi -->
  <footer class="footer">
    <h2>Əlaqə və Ünvan</h2>
    <p><strong>Telefon:</strong> +994 50 123 45 67</p>
    <p><strong>Ünvan:</strong> Nizami küç. 45, Bakı, Azərbaycan</p>
    
    <div class="map-container">
      <iframe 
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3039.522207399865!2d49.8398453!3d40.3752152!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x40307d1f1107f909%3A0x889814523277028!2sNizami%20St%2C%20Baku!5e0!3m2!1sen!2saz!4v1690000000000!5m2!1sen!2saz" 
        width="100%" height="250" style="border:0;" allowfullscreen="" loading="lazy">
      </iframe>
    </div>
  </footer>

  <!-- Admin Girişi Düyməsi -->
  <div style="text-align: center; margin: 20px;">
    <button onclick="openAdminPanel()" style="background:none; border:none; color:gray; cursor:pointer;">Admin Girişi</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
