<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vərəqlənən Rəqəmsal Menyu</title>
  <link rel="stylesheet" href="style.css">
  <!-- Vərəqləmə Kitabxanası -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip@0.8.8/dist/js/page-flip.browser.js"></script>
</head>
<body>

  <div class="book-container">
    <div id="myBook" class="flip-book">
      
      <!-- Üzlük Vərəqi -->
      <div class="page page-cover">
        <div class="cover-content">
          <h1>RESTORAN MENYUSU</h1>
          <p>Ləzzətli təamlar və sərin içkilər</p>
          <span>Vərəqləmək üçün sürüşdürün ➔</span>
        </div>
      </div>

      <!-- Səhifə 1: İçkilər -->
      <div class="page">
        <h2 class="page-title">Sərin İçkilər</h2>
        <div id="ickiler" class="menu-list"></div>
      </div>

      <!-- Səhifə 2: Yeməklər -->
      <div class="page">
        <h2 class="page-title">Ləzzətli Yeməklər</h2>
        <div id="yemekler" class="menu-list"></div>
      </div>

      <!-- Səhifə 3: Desertlər -->
      <div class="page">
        <h2 class="page-title">Xüsusi Desertlər</h2>
        <div id="desertler" class="menu-list"></div>
      </div>

      <!-- Son Səhifə: Əlaqə -->
      <div class="page page-cover">
        <div class="cover-content">
          <h2>Əlaqə və Ünvan</h2>
          <p><strong>Tel:</strong> +994 50 123 45 67</p>
          <p><strong>Ünvan:</strong> Nizami küç. 45, Bakı</p>
          <p style="margin-top: 20px; font-size: 14px;">Nuş olsun!</p>
        </div>
      </div>

    </div>
  </div>

  <!-- Admin Paneli (Gizli) -->
  <section class="admin-panel hidden" id="adminPanel">
    <h3>Yeni Məhsul Əlavə Et</h3>
    <input type="text" id="pName" placeholder="Məhsul adı">
    <input type="text" id="pPrice" placeholder="Qiymət (məs: 5 AZN)">
    <select id="pCategory">
      <option value="ickiler">İçkilər</option>
      <option value="yemekler">Yeməklər</option>
      <option value="desertler">Desertlər</option>
    </select>
    <input type="file" id="pImage" accept="image/*">
    <button onclick="addProduct()">Əlavə et</button>
  </section>

  <!-- Admin Giriş Düyməsi -->
  <div style="text-align: center; margin: 15px;">
    <button onclick="openAdminPanel()" style="background:none; border:none; color:gray; cursor:pointer;">Admin Girişi</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
